name: Desktop
on:
  push:
    branches: [master, 'feat/**']
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: build-${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            os: windows-latest
          - platform: macOS
            os: macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Prepare dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Flutter dependencies
        run: flutter pub get
        working-directory: desktop
      - name: Download verified test core
        run: python scripts/download_test_core.py
      - name: Engine regression tests
        run: python -c "import subprocess,sys; subprocess.run([sys.executable,'-W','error::ResourceWarning','-m','unittest','discover','-s','tests','-v'],timeout=60,check=True)"
      - name: Flutter analysis
        run: flutter analyze --no-pub
        working-directory: desktop
      - name: Flutter tests
        run: flutter test --no-pub --timeout 60s
        working-directory: desktop
      - name: Build application bundle
        run: python scripts/build_bundle.py
      - name: Frozen engine smoke test
        run: python tests/packaged_engine.py
      - uses: actions/upload-artifact@v4
        with:
          name: NodeScope-${{ matrix.platform }}
          path: dist/*.zip
          if-no-files-found: error
